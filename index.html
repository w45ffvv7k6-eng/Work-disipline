<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0a09" />
    <!-- Sécurité : seuls les fichiers de l'appli elle-même peuvent être chargés ou contactés. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Work &amp; Discipline</title>
    <meta name="apple-mobile-web-app-title" content="Work &amp; Discipline" />
    <meta name="application-name" content="Work &amp; Discipline" />
    <!-- Appli installée : plein écran, sans barre du navigateur. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/favicon-64.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Filet de sécurité : si l'appli ne démarre pas, on affiche l'erreur au lieu d'une page blanche. -->
    <script>
      (function () {
        var errors = [];
        function escape(text) {
          return String(text).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }
        function show() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;color:#f6f0e8;background:#0b0a09;padding:24px;line-height:1.5">' +
            '<h1 style="font-size:22px">L’appli n’a pas pu démarrer</h1>' +
            '<p>Fais une capture d’écran de cette page et envoie-la pour qu’on corrige le problème.</p>' +
            '<p style="font-size:13px;color:#ab9c8c;word-break:break-word">' +
            (errors.map(escape).join('<br>') || 'Aucune erreur détectée (chargement trop long ?)') +
            '<br><br>' +
            escape(navigator.userAgent) +
            '</p>' +
            '<button onclick="location.reload()" style="font-size:18px;padding:14px 20px;border-radius:12px;border:0;background:#f2a03d;color:#1c1105;font-weight:700">Réessayer</button>' +
            '</div>';
        }
        window.addEventListener(
          'error',
          function (e) {
            errors.push(String(e.message || (e.target && e.target.src) || 'Erreur inconnue'));
            setTimeout(show, 300);
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (e) {
          errors.push('Promesse : ' + String((e.reason && e.reason.message) || e.reason));
          setTimeout(show, 300);
        });
        setTimeout(show, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
